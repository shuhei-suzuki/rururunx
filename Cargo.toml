[workspace]
members = ["crates/rrx", "crates/rrx-process-tracker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/shuhei-suzuki/rururunx"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "net"] }
rustix = { version = "1.1", features = ["process", "fs"] }
libc = "0.2"
sha2 = "0.10"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
