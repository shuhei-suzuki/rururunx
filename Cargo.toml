[workspace]
members = ["crates/rrx"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/shuhei-suzuki/rururunx"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
nix = { version = "0.30", features = ["signal", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
