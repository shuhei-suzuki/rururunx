# MEASUREMENT ONLY (Issue #89 CI triage). Lives on a measurement branch and is never merged.
name: Issue 89 flock trace
on:
  push:
    branches: [claude/project-thread-jzxouc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      RRX_FLOCK_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.1
      - run: cargo build --locked --workspace
      - run: cargo test --locked -p rrx --lib --no-run
      - name: Reopen-heavy tests, serial, repeated
        shell: bash
        run: |
          mkdir -p out
          for i in $(seq 1 40); do
            cargo test --locked -p rrx --lib runtime::installation::tests::epoch_fence -- --test-threads=1 --nocapture > out/ef-$i.log 2>&1 || echo "ef run $i failed" >> out/summary.txt
          done
          for i in $(seq 1 10); do
            cargo test --locked -p rrx --lib runtime::installation::tests::fm_rb -- --test-threads=1 > out/fmrb-$i.log 2>&1 || echo "fm_rb run $i failed" >> out/summary.txt
            cargo test --locked -p rrx --lib execution::owner::tests > out/owner-$i.log 2>&1 || echo "owner run $i failed" >> out/summary.txt
            cargo test --locked -p rrx --lib execution::cleanup::tests > out/cleanup-$i.log 2>&1 || echo "cleanup run $i failed" >> out/summary.txt
          done
      - name: Full lib, default threads, x3
        shell: bash
        run: |
          for i in 1 2 3; do
            env -u RRX_FLOCK_TRACE cargo test --locked -p rrx --lib > out/lib-$i.log 2>&1 || echo "lib run $i failed" >> out/summary.txt
          done
      - name: Report
        if: always()
        shell: bash
        run: |
          touch out/summary.txt
          echo "== failed runs"; cat out/summary.txt
          echo "== FLOCK_TRACE lines"; grep -h "FLOCK_TRACE" out/*.log || echo "none"
          echo "== failing tests"; grep -h -A12 "^---- " out/*.log | grep -v "EF1_TRACE" | grep -v "ISSUE87" | cut -c1-400 || true
          echo "== EF1_TAIL (state, kinds only) counts"; grep -h "EF1_TAIL" out/ef-*.log | sed -E 's/@[0-9-]+//g' | sort | uniq -c | cut -c1-900 || true
          echo "== EF1_TAIL with times"; grep -h "EF1_TAIL" out/ef-*.log | cut -c1-900 || true
          echo "== panics"; grep -h -A2 "panicked at" out/*.log | grep -v "EF1_TRACE\|ISSUE87" | cut -c1-400 | sort | uniq -c | sort -rn | head -60 || true
          echo "== EF1_TRACE line count"; cat out/*.log | grep -c "EF1_TRACE" || true
          echo "== tails of lib runs"; for f in out/lib-*.log; do echo "--- $f"; grep -v " ok$" "$f" | grep -A12 "^---- \|^test result" | grep -v ISSUE87 | tail -60 | cut -c1-400; done
          echo "== results"; for f in out/*.log; do echo "$f: $(grep -h '^test result' "$f" | tr '\n' ' ')"; done
