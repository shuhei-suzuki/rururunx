# TEMPORARY Issue #87 measurement. Removed before the fix PR is proposed.
name: Issue 87 measure
on:
  pull_request:
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, ref: head, plan: t12x3, shard: a }
          - { os: macos-latest, ref: head, plan: t12x3, shard: b }
          - { os: macos-latest, ref: head, plan: t12x3, shard: c }
          - { os: macos-latest, ref: head, plan: default5, shard: d }
          - { os: macos-latest, ref: head, plan: default5, shard: e }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Keep the measurement script, then select the ref
        run: |
          cp scripts/issue87-measure.sh "$RUNNER_TEMP/measure.sh"
          if [ "${{ matrix.ref }}" = baseline-1c08445 ]; then git checkout --detach 1c08445341d1ff06905a7c28d82f4207d04fa3d2; fi
          git log -1 --format='measured ref %H %s'
      - uses: dtolnay/rust-toolchain@1.91.1
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace --no-run
      - name: Show the bundled SQLite build flags (D4)
        run: grep -rho -- '-DSQLITE_DEFAULT_MEMSTATUS=[0-9]' target/debug/build/libsqlite3-sys-*/output | sort | uniq -c || echo "MEMSTATUS flag not found in build output"
      - name: Measure
        run: bash "$RUNNER_TEMP/measure.sh" "$RUNNER_TEMP/logs"
        env:
          ISSUE87_PLAN: ${{ matrix.plan }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue87-${{ matrix.os }}-${{ matrix.ref }}-${{ matrix.plan }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/logs
